<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 460" width="400" height="460">
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5A623;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8430A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="orangeGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E84B0A;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Outer right orange chevron/diamond shape -->
  <polygon points="200,20 360,160 200,300 240,300 390,160 240,20" fill="url(#orangeGrad)" />

  <!-- Outer left orange chevron/diamond shape -->
  <polygon points="200,20 40,160 200,300 160,300 10,160 160,20" fill="url(#orangeGrad)" />

  <!-- Inner white diamond cutout (right) -->
  <polygon points="230,60 340,160 230,260 260,260 360,160 260,60" fill="white" />

  <!-- Inner white diamond cutout (left) -->
  <polygon points="170,60 60,160 170,260 140,260 40,160 140,60" fill="white" />

  <!-- Inner white angular shape (center-right) -->
  <polygon points="200,80 310,160 200,240 220,240 325,160 220,80" fill="white" />

  <!-- Inner white angular shape (center-left) -->
  <polygon points="200,80 90,160 200,240 180,240 75,160 180,80" fill="white" />

  <!-- Center orange diamond background -->
  <polygon points="200,90 265,160 200,230 135,160" fill="url(#orangeGrad2)" />

  <!-- Cyan/teal center diamond -->
  <polygon points="200,105 255,160 200,215 145,160" fill="#00BCD4" />

  <!-- White keyhole/lock symbol -->
  <circle cx="200" cy="150" r="18" fill="white" />
  <polygon points="191,155 209,155 214,195 186,195" fill="white" />
  <circle cx="200" cy="150" r="9" fill="#00BCD4" />

  <!-- Circuit board lines (lower right) -->
  <g stroke="white" stroke-width="2" fill="none" opacity="0.7">
    <line x1="260" y1="240" x2="330" y2="240" />
    <line x1="330" y1="240" x2="330" y2="260" />
    <line x1="270" y1="255" x2="320" y2="255" />
    <line x1="320" y1="255" x2="320" y2="270" />
    <line x1="280" y1="268" x2="310" y2="268" />
    <circle cx="330" cy="240" r="3" fill="white" />
    <circle cx="320" cy="255" r="3" fill="white" />
    <circle cx="310" cy="268" r="3" fill="white" />
  </g>

  <!-- Accent diamonds scattered -->
  <!-- Top-left small orange diamond -->
  <polygon points="105,55 115,65 105,75 95,65" fill="#F5A623" />
  <!-- Top-center small cyan diamond -->
  <polygon points="155,35 163,43 155,51 147,43" fill="#00BCD4" />
  <!-- Top-right small red diamond -->
  <polygon points="250,50 260,60 250,70 240,60" fill="#E84B0A" />
  <!-- Right small red diamond -->
  <polygon points="298,90 308,100 298,110 288,100" fill="#E84B0A" />
  <!-- Top-right small orange diamond -->
  <polygon points="270,30 278,38 270,46 262,38" fill="#F5A623" />

  <!-- "overwatch" text -->
  <text
    x="200"
    y="390"
    font-family="'Arial', 'Helvetica', sans-serif"
    font-size="52"
    font-weight="700"
    fill="#E8430A"
    text-anchor="middle"
    letter-spacing="1"
  >overwatch</text>
</svg>
